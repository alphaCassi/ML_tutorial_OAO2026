# Interaction Matrix and Reconstructor Calibration
# ================================================

# Push-pull command generator
pushpull:
  class:        'PushPullGenerator'
  nmodes:    457 #  220                        # Number of DM actuators
  amp:       50 #    20
  outputs:   ['output']

# Interaction matrix calibrator
pyr_im_calibrator:
  class:     'ImCalibrator'
  nmodes: 457 #   220                         # Number of modes to calibrate
  im_tag:   'pyr0.0_40x40_im' #  'pyr0.0_20x20_im'            # Output IM filename
  overwrite: false                         # Overwrite existing files
  inputs:
    in_slopes:   'pyr_slopes.out_slopes'      # WFS slopes input
    in_commands: 'pushpull.output'        # Push-pull commands


# Reconstructor calibrator
py_rec_calibrator:
  class:     'RecCalibrator'
  nmodes:    400                         # Number of modes (reduced to keep noise propagation low and avoid numerical issues)
  rec_tag:   'pyr7.0_40x40_400modes_rec'               # Output REC filename
  overwrite: true                         # Overwrite existing files
  inputs:
    in_intmat:   'pyr_im_calibrator.out_intmat'  # Connect to IM output


# Override main simulation parameters
main_override:
  time_step: 0.001
  total_time: 0.8 #0.44                 # 400 modes × 2 (push+pull) × 0.001s

# Disable atmosphere for clean calibration
prop_override:
  source_dict_ref:   ['source_ngs']
  inputs:
    common_layer_list: ['pupilstop', 'dm2.out_layer']  # Only pupil + DM
  outputs:           ['out_source_ngs_ef']

pyr_slopes_override:
  pupdata_object:    'pyr_pupdata_40x40'    #   'pyr_pupdata_20x20'  

# Override DM to use calibration commands
dm2_override:
  sign: 1                                 # Use positive sign for calibration (default is -1)
  nmodes: 457 # 220                            # Use all modes for calibration
  inputs:
    in_command: 'pushpull.output'         # Connect to push-pull generator

pyr_override:
  pup_diam:    40. #      20.                     # Pupil diameter in subaps.
  pup_dist:     60. #     30.    
  mod_amp: 7.0
  inputs: 
    in_ef: 'prop.out_source_ngs_ef'

# pyr_slopes_override:
#   slopes_from_intensity: false

# Disable noise for clean measurements
ocam_override:
  photon_noise:   false                   # No photon noise
  readout_noise:  false                   # No read noise
  excess_noise:   false                   # No excess noise

# Remove unnecessary objects during calibration
remove: ['atmo','seeing','wind_speed','wind_direction','data_store','atmo_modes',
        'dm_mode_res','filter','psf', 'pyr_modalrec','psf_disp','slicer_modal', 'modes_disp'] 

