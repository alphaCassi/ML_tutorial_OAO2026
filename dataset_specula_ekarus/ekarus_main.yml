# --- DM ---
dm1:
  class:           'DM'
  simul_params_ref: 'main'
  ifunc_object:    'DM468_ifunc'
  m2c_object:      'DM468_m2c'
  height:          0
  nmodes:          400
  inputs:
    in_command: 'filter1.out_comm'
  outputs: ['out_layer']

