dm_mode_res:
  class:            'ModalAnalysis'
  ifunc_inv_object: 'DM468_kl_inv'
  inputs:
  #  in_ef: ['ef_prop.out_ef']
    in_ef: ['prop.out_source_ngs_ef']
  outputs: ['out_modes']

atmo_modes:
  class:            'ModalAnalysis'
  ifunc_inv_object: 'DM468_kl_inv'
  inputs:
    in_ef: ['prop.out_source_ngs_ef']
  outputs: ['out_modes']

