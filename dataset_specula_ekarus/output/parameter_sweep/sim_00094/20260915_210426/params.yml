main:
  class: SimulParams
  root_dir: ./calibration
  pixel_pupil: 120
  pixel_pitch: 0.015167
  total_time: 0.5
  time_step: 0.001
  zenithAngleInDeg: 37.571133349638906
  display_server: false
seeing:
  class: WaveGenerator
  constant: 0.9532340761792188
wind_speed:
  class: WaveGenerator
  constant:
  - 11.775363937874781
  - 19.886096811786054
  - 18.371481506279235
  - 35.292690884119295
wind_direction:
  class: WaveGenerator
  constant:
  - 296.5759323436298
  - 329.904037433419
  - 314.94519190290725
  - 277.327003670322
source_ngs:
  class: Source
  polar_coordinates:
  - 0.0
  - 0.0
  height: .inf
  magnitude: 1.6345986368956371
  wavelengthInNm: 750
pupilstop:
  class: Pupilstop
  tag: DM468_120pixels
atmo:
  class: AtmoEvolution
  simul_params_ref: main
  L0: 33.046205623608195
  heights:
  - 110
  - 238
  - 402
  - 728
  Cn2:
  - 0.7040843974881937
  - 0.0602630686050681
  - 0.1392735656104586
  - 0.09637896829627961
  fov: 0.0
  inputs:
    seeing: seeing.output
    wind_speed: wind_speed.output
    wind_direction: wind_direction.output
  outputs:
  - layer_list
  seed: 95
prop:
  class: AtmoPropagation
  simul_params_ref: main
  doFresnel: false
  padding_factor: 16
  wavelengthInNm: 750
  source_dict_ref:
  - source_ngs
  inputs:
    atmo_layer_list:
    - atmo.layer_list
    common_layer_list:
    - pupilstop
    - dm1.out_layer:-1
  outputs:
  - out_source_ngs_ef
pyr:
  class: ModulatedPyramid
  simul_params_ref: main
  pup_diam: 40.0
  pup_dist: 60.0
  fov: 4.0
  mod_amp: 7.0
  output_resolution: 120
  wavelengthInNm: 750
  inputs:
    in_ef: prop.out_source_ngs_ef
ocam:
  class: CCD
  simul_params_ref: main
  size:
  - 120
  - 120
  dt: 0.001
  bandw: 300
  photon_noise: true
  readout_noise: true
  excess_noise: true
  readout_level: 0.4
  emccd_gain: 600
  quantum_eff: 0.06
  inputs:
    in_i: pyr.out_i
  outputs:
  - out_pixels
pyr_slopes:
  class: PyrSlopec
  pupdata_object: pyr_pupdata_40x40
  slopes_from_intensity: true
  inputs:
    in_pixels: ocam.out_pixels
  outputs:
  - out_slopes
pyr_modalrec:
  class: Modalrec
  recmat_object: pyr7.0_40x40_400modes_rec
  inputs:
    in_slopes: pyr_slopes.out_slopes
  outputs:
  - out_modes
filter1:
  class: Integrator
  delay: 2.0
  int_gain:
  - 0.3
  - 0.2
  ff:
  - 0.98
  - 0.987
  n_modes:
  - 2
  - 398
  inputs:
    delta_comm: pyr_modalrec.out_modes
dm1:
  class: DM
  simul_params_ref: main
  ifunc_object: DM468_ifunc
  m2c_object: DM468_m2c
  height: 0
  nmodes: 400
  inputs:
    in_command: filter1.out_comm
  outputs:
  - out_layer
psf:
  class: PSF
  simul_params_ref: main
  wavelengthInNm: 750
  nd: 8
  start_time: 0.05
  compute_profile_metrics: true
  compute_metrics_in_trigger: true
  ee_radius_in_lambda_d: 4
  inputs:
    in_ef: prop.out_source_ngs_ef
  outputs:
  - out_psf
  - out_std_psf
  - out_sr
dm_mode_res:
  class: ModalAnalysis
  ifunc_inv_object: DM468_kl_inv
  inputs:
    in_ef:
    - prop.out_source_ngs_ef
  outputs:
  - out_modes
atmo_modes:
  class: ModalAnalysis
  ifunc_inv_object: DM468_kl_inv
  inputs:
    in_ef:
    - prop.out_source_ngs_ef
  outputs:
  - out_modes
data_store:
  class: DataStore
  store_dir: ./output/parameter_sweep/sim_00094
  data_format: fits
  inputs:
    psfint: psfint-psf.out_int_psf
    comm: comm-filter1.out_comm
    sr: sr-psf.out_sr
    sr_int: sr_int-psf.out_int_sr
    psffwhm_int: psffwhm_int-psf.out_int_psf_fwhm
    psffwhm: psffwhm-psf.out_psf_fwhm
    psfee_int: psfee_int-psf.out_int_encircled_energy_at_radius
    psfee: psfee-psf.out_encircled_energy_at_radius
ph_display:
  class: PhaseDisplay
  inputs:
    phase: prop.out_source_ngs_ef
  title: PUPIL PHASE
psf_disp:
  class: PsfDisplay
  log_scale: true
  inputs:
    psf: psf.out_psf
  title: PSF
  figsize:
  - 8
  - 6
dm_disp:
  class: PhaseDisplay
  inputs:
    phase: dm1.out_layer
  title: DM
  figsize:
  - 8
  - 6
